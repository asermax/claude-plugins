<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #666666;
  --line: #dddddd;
  --panel: #f6f6f6;
  --pass: #0a7d33;
  --fixed: #8a5a00;
  --fail: #b3261e;
  --blocked: #b3261e;
  --skip: #666666;
  --link: #0b57d0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161616;
    --fg: #eeeeee;
    --muted: #aaaaaa;
    --line: #333333;
    --panel: #202020;
    --pass: #4cc97a;
    --fixed: #f0b84a;
    --fail: #ff8a80;
    --blocked: #ff8a80;
    --skip: #aaaaaa;
    --link: #8ab4f8;
  }
}

body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 16px; }
a { color: var(--link); }
h1 { margin-bottom: 4px; }
h2 { margin-top: 32px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
h3 { margin-top: 24px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
.scroll { overflow-x: auto; }
.kv th { width: 14%; white-space: nowrap; }
.muted { color: var(--muted); }
code { font-size: 13px; background: var(--panel); padding: 0 3px; border-radius: 3px; }
pre { background: var(--panel); padding: 8px; overflow-x: auto; }
ol, ul { margin: 4px 0; padding-left: 22px; }
.result { font-weight: 700; }
.passed { color: var(--pass); }
.passed_after_fix { color: var(--fixed); }
.failed, .blocked { color: var(--fail); }
.not_run { color: var(--skip); }
.evidence { display: flex; flex-wrap: wrap; gap: 12px; }
.evidence figure { margin: 0; max-width: 420px; }
.evidence img { max-width: 100%; border: 1px solid var(--line); }
.evidence figcaption { font-size: 13px; color: var(--muted); word-break: break-all; }
.fix { border-left: 3px solid var(--fixed); padding: 2px 10px; margin: 8px 0; background: var(--panel); }
.blockedbox { border-left: 3px solid var(--blocked); padding: 2px 10px; margin: 8px 0; background: var(--panel); }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
